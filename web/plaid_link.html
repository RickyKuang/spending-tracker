<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Link your bank — spending-tracker</title>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      color: #1a1a1a;
    }
    .card {
      max-width: 420px;
      width: 90%;
      padding: 2.5rem 2rem;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 0.5rem;
    }
    p.status {
      font-size: 0.95rem;
      color: #555;
      margin: 0.5rem 0 0;
    }
    .spinner {
      margin: 1.5rem auto;
      width: 32px;
      height: 32px;
      border: 3px solid #ddd;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .state-success .spinner,
    .state-error .spinner {
      display: none;
    }
    .state-success p.status {
      color: #1a7f37;
    }
    .state-error p.status {
      color: #cf222e;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>Connecting your bank</h1>
    <div class="spinner" id="spinner"></div>
    <p class="status" id="status">Connecting your bank...</p>
  </div>

  <script>
    (function () {
      var card = document.getElementById("card");
      var statusEl = document.getElementById("status");

      function setState(state, message) {
        card.className = "state-" + state;
        statusEl.textContent = message;
      }

      var params = new URLSearchParams(window.location.search);
      var linkToken = params.get("token");
      var linkSessionId = params.get("session");

      if (!linkToken || !linkSessionId) {
        setState("error", "Missing token or session in URL. Please restart the link flow from the CLI.");
        return;
      }

      var handler = Plaid.create({
        token: linkToken,
        onSuccess: function (public_token, metadata) {
          setState("pending", "Finishing up...");
          fetch("/api/plaid/link/exchange", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              public_token: public_token,
              link_session_id: linkSessionId,
            }),
          })
            .then(function (resp) {
              if (!resp.ok) {
                throw new Error("Exchange request failed with status " + resp.status);
              }
              setState("success", "Bank connected! You can close this tab and return to the CLI.");
            })
            .catch(function (err) {
              setState("error", "Failed to finish linking: " + err.message);
            });
        },
        onExit: function (err, metadata) {
          if (err) {
            setState("error", "Link exited with an error: " + err.error_message);
          } else {
            setState("error", "Link was closed before completing. You can close this tab and retry from the CLI.");
          }
        },
      });

      handler.open();
    })();
  </script>
</body>
</html>
