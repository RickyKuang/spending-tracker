services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: spender
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: spender
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spender -d spender"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"

volumes:
  db_data:
